
name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-wallet-debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK with Existing Firebase Signing Key
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPECTED_SHA1: "B0:5C:6B:8D:6A:17:71:D6:6C:59:5B:F5:C4:A6:AD:57:88:15:E5:99"
      EXPECTED_SHA256: "3D:BF:32:AA:F5:B9:91:5C:6A:4B:EB:EB:96:B8:DF:16:82:29:13:6E:CD:51:E4:56:82:9F:82:54:79:67:B3:BC"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Gradle
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          java -version
          ./gradlew --version

      - name: Restore signing key cache
        id: keystore_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.android/debug.keystore
            ./debug.keystore
          key: my-wallet-debug-keystore-v1

      - name: Restore existing Firebase signing key
        id: signing
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          GLOBAL="$HOME/.android/debug.keystore"
          LOCAL="$GITHUB_WORKSPACE/debug.keystore"
          TEMP="$RUNNER_TEMP/debug-keystore.tmp"

          normalize() {
            printf '%s' "$1" |
              tr -d ':' |
              tr '[:lower:]' '[:upper:]'
          }

          valid_key() {
            [ -s "$1" ] &&
            keytool -list -keystore "$1" \
              -alias androiddebugkey \
              -storepass android >/dev/null 2>&1
          }

          SOURCE=""

          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "Restoring original key from GitHub Secret"

            if ! printf '%s' "$DEBUG_KEYSTORE_BASE64" |
              base64 --decode > "$TEMP"; then
              echo "::error::Invalid Base64 keystore secret."
              exit 1
            fi

            if ! valid_key "$TEMP"; then
              echo "::error::Invalid keystore, alias or password."
              exit 1
            fi

            cp "$TEMP" "$GLOBAL"
            cp "$TEMP" "$LOCAL"
            SOURCE="GitHub Secret"

          elif valid_key "$GLOBAL"; then
            cp "$GLOBAL" "$LOCAL"
            SOURCE="GitHub Cache"

          elif valid_key "$LOCAL"; then
            cp "$LOCAL" "$GLOBAL"
            SOURCE="Repository Keystore"

          else
            echo "::error::Original signing key not found."
            echo "Add the original keystore as DEBUG_KEYSTORE_BASE64."
            exit 1
          fi

          rm -f "$TEMP"

          HASH1="$(sha256sum "$GLOBAL" | awk '{print $1}')"
          HASH2="$(sha256sum "$LOCAL" | awk '{print $1}')"

          if [ "$HASH1" != "$HASH2" ]; then
            echo "::error::Keystore files do not match."
            exit 1
          fi

          INFO="$(keytool -list -v \
            -keystore "$LOCAL" \
            -alias androiddebugkey \
            -storepass android)"

          ACTUAL_SHA1="$(printf '%s\n' "$INFO" |
            awk -F': ' '/SHA1:/{print $2; exit}')"

          ACTUAL_SHA256="$(printf '%s\n' "$INFO" |
            awk -F': ' '/SHA256:/{print $2; exit}')"

          if [ -z "$ACTUAL_SHA1" ] || [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::Could not read signing fingerprints."
            exit 1
          fi

          if [ "$(normalize "$ACTUAL_SHA1")" != "$(normalize "$EXPECTED_SHA1")" ]; then
            echo "::error::Firebase SHA-1 mismatch."
            echo "Actual: $ACTUAL_SHA1"
            exit 1
          fi

          if [ "$(normalize "$ACTUAL_SHA256")" != "$(normalize "$EXPECTED_SHA256")" ]; then
            echo "::error::Firebase SHA-256 mismatch."
            echo "Actual: $ACTUAL_SHA256"
            exit 1
          fi

          echo "Original Firebase signing key verified."
          echo "Source: $SOURCE"
          echo "SHA-1: $ACTUAL_SHA1"
          echo "SHA-256: $ACTUAL_SHA256"

          echo "keystore_source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Save signing key cache
        if: steps.keystore_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.android/debug.keystore
            ./debug.keystore
          key: my-wallet-debug-keystore-v1

      - name: Verify Firebase configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          mkdir -p app

          if [ ! -f app/google-services.json ]; then
            if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
              echo "::error::Firebase configuration missing."
              exit 1
            fi

            printf '%s' "$GOOGLE_SERVICES_JSON" \
              > app/google-services.json
          fi

          python3 - <<'PY'
          import json
          import sys

          EXPECTED_PACKAGE = "com.aistudio.mywallet.bdtnas"

          try:
              with open("app/google-services.json", encoding="utf-8") as f:
                  data = json.load(f)

              clients = data.get("client", [])

              packages = [
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
                  for client in clients
              ]

              if EXPECTED_PACKAGE not in packages:
                  raise ValueError(
                      "Firebase package name does not match the app."
                  )

              print("Firebase JSON verified.")
              print("Package:", EXPECTED_PACKAGE)

          except Exception as error:
              print(f"::error::Firebase error: {error}")
              sys.exit(1)
          PY

      - name: Build Debug APK
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Xmx3072m
            -XX:MaxMetaspaceSize=512m
            -Dorg.gradle.workers.max=2
            -Dorg.gradle.configuration-cache=false
            -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not created."
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME:-/opt/android/sdk}/build-tools" \
            -type f -name apksigner 2>/dev/null |
            sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          CERT="$("$APKSIGNER" verify --print-certs "$APK")"

          SHA1="$(printf '%s\n' "$CERT" |
            awk 'tolower($0) ~ /certificate sha-1 digest:/ {print $NF; exit}')"

          SHA256="$(printf '%s\n' "$CERT" |
            awk 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}')"

          normalize() {
            printf '%s' "$1" |
              tr -d ':' |
              tr '[:lower:]' '[:upper:]'
          }

          if [ -z "$SHA1" ] || [ -z "$SHA256" ]; then
            echo "::error::Could not read APK fingerprints."
            exit 1
          fi

          if [ "$(normalize "$SHA1")" != "$(normalize "$EXPECTED_SHA1")" ]; then
            echo "::error::APK SHA-1 mismatch."
            exit 1
          fi

          if [ "$(normalize "$SHA256")" != "$(normalize "$EXPECTED_SHA256")" ]; then
            echo "::error::APK SHA-256 mismatch."
            exit 1
          fi

          echo "APK signature verified successfully."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: My-Wallet-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare APK Release
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/release"

          NAME="My-Wallet-${GITHUB_RUN_NUMBER}.apk"
          PATH_APK="$RUNNER_TEMP/release/$NAME"

          cp app/build/outputs/apk/debug/app-debug.apk "$PATH_APK"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=$PATH_APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="my-wallet-debug-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" \
            "${{ steps.prepare.outputs.path }}#${{ steps.prepare.outputs.name }}" \
            --title "My Wallet Debug APK #${GITHUB_RUN_NUMBER}" \
            --notes "My Wallet Debug APK

          Commit: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Signing: Existing Firebase key verified."
          
