name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-wallet-debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK with Persistent Firebase-Registered Signing Key
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Keep this exact cache key stable. The secret below is the durable
      # source of truth; the cache is a fallback if the secret is unavailable.
      - name: Restore persistent debug keystore cache
        id: keystore_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/debug.keystore
            ./debug.keystore
          key: my-wallet-debug-keystore-v1

      - name: Restore and validate the original signing key
        id: signing
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"
          GLOBAL_KEYSTORE="$HOME/.android/debug.keystore"
          LOCAL_KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"
          TEMP_KEYSTORE="$RUNNER_TEMP/debug-keystore.tmp"

          # SHA fingerprints for the newly generated permanent My Wallet key.
          FIREBASE_SHA1_1="B0:5C:6B:8D:6A:17:71:D6:6C:59:5B:F5:C4:A6:AD:57:88:15:E5:99"
          FIREBASE_SHA1_2=""
          FIREBASE_SHA256_1="3D:BF:32:AA:F5:B9:91:5C:6A:4B:EB:EB:96:B8:DF:16:82:29:13:6E:CD:51:E4:56:82:9F:82:54:79:67:B3:BC"

          normalize_fp() {
            printf '%s' "$1" | tr -d ':' | tr '[:lower:]' '[:upper:]'
          }

          is_valid_keystore() {
            local file="$1"
            [ -s "$file" ] &&
              keytool -list -keystore "$file" \
                -alias androiddebugkey \
                -storepass android >/dev/null 2>&1
          }

          echo "=== Restoring the original debug signing key ==="
          rm -f "$TEMP_KEYSTORE"
          KEYSTORE_SOURCE=""

          # Priority 1: durable repository secret. If present but invalid,
          # fail immediately rather than silently signing with another key.
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "Trying DEBUG_KEYSTORE_BASE64 secret..."
            if ! printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$TEMP_KEYSTORE" 2>/dev/null; then
              echo "::error::DEBUG_KEYSTORE_BASE64 is not valid Base64."
              exit 1
            fi

            if ! is_valid_keystore "$TEMP_KEYSTORE"; then
              echo "::error::DEBUG_KEYSTORE_BASE64 is not a valid Android debug keystore."
              exit 1
            fi

            cp "$TEMP_KEYSTORE" "$GLOBAL_KEYSTORE"
            cp "$TEMP_KEYSTORE" "$LOCAL_KEYSTORE"
            KEYSTORE_SOURCE="GitHub Actions secret"
          # Priority 2: previously cached key.
          elif is_valid_keystore "$GLOBAL_KEYSTORE"; then
            cp "$GLOBAL_KEYSTORE" "$LOCAL_KEYSTORE"
            KEYSTORE_SOURCE="GitHub Actions cache"
          # Priority 3: checked-in root debug.keystore, if the project keeps it.
          elif is_valid_keystore "$LOCAL_KEYSTORE"; then
            cp "$LOCAL_KEYSTORE" "$GLOBAL_KEYSTORE"
            KEYSTORE_SOURCE="repository debug.keystore"
          else
            echo "::error::No original debug keystore was found."
            echo "No new key will be generated. Add the original keystore as the DEBUG_KEYSTORE_BASE64 repository secret."
            exit 1
          fi

          rm -f "$TEMP_KEYSTORE"

          if ! is_valid_keystore "$LOCAL_KEYSTORE" || ! is_valid_keystore "$GLOBAL_KEYSTORE"; then
            echo "::error::Restored keystore failed validation."
            exit 1
          fi

          LOCAL_HASH="$(sha256sum "$LOCAL_KEYSTORE" | awk '{print $1}')"
          GLOBAL_HASH="$(sha256sum "$GLOBAL_KEYSTORE" | awk '{print $1}')"
          if [ "$LOCAL_HASH" != "$GLOBAL_HASH" ]; then
            echo "::error::Workspace and Android-home keystores are not identical."
            exit 1
          fi

          KEY_INFO="$(keytool -list -v \
            -keystore "$LOCAL_KEYSTORE" \
            -alias androiddebugkey \
            -storepass android)"

          KEY_SHA1="$(printf '%s\n' "$KEY_INFO" | awk -F': ' '/SHA1:/{print $2; exit}')"
          KEY_SHA256="$(printf '%s\n' "$KEY_INFO" | awk -F': ' '/SHA256:/{print $2; exit}')"

          if [ -z "$KEY_SHA1" ] || [ -z "$KEY_SHA256" ]; then
            echo "::error::Could not read the restored signing certificate fingerprints."
            exit 1
          fi

          KEY_SHA1_NORMALIZED="$(normalize_fp "$KEY_SHA1")"
          if [ "$KEY_SHA1_NORMALIZED" != "$(normalize_fp "$FIREBASE_SHA1_1")" ]; then
            echo "::error::Restored keystore SHA-1 does not match the new permanent My Wallet fingerprint."
            echo "Actual SHA-1: $KEY_SHA1"
            echo "Expected SHA-1: $FIREBASE_SHA1_1"
            echo "Build stopped to prevent producing an APK signed by the wrong key."
            exit 1
          fi

          echo "Keystore source: $KEYSTORE_SOURCE"
          echo "Verified keystore SHA-1: $KEY_SHA1"
          echo "Verified keystore SHA-256: $KEY_SHA256"

          if [ "$(normalize_fp "$KEY_SHA256")" = "$(normalize_fp "$FIREBASE_SHA256_1")" ]; then
            echo "Supplied Firebase SHA-256 also matches this certificate."
          else
            echo "::notice::The supplied SHA-256 is not the SHA-256 of this selected key. This is informational; SHA-1 is the configured Firebase allowlist."
          fi

          echo "keystore_source=$KEYSTORE_SOURCE" >> "$GITHUB_OUTPUT"
          echo "keystore_sha1=$KEY_SHA1" >> "$GITHUB_OUTPUT"
          echo "keystore_sha256=$KEY_SHA256" >> "$GITHUB_OUTPUT"

      - name: Save restored key to cache if cache is not already present
        if: steps.keystore_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/debug.keystore
            ./debug.keystore
          key: my-wallet-debug-keystore-v1

      - name: Verify or restore google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          mkdir -p app

          if [ -f app/google-services.json ]; then
            echo "Using app/google-services.json from repository."
          elif [ -n "${GOOGLE_SERVICES_JSON_SECRET:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            echo "Restored app/google-services.json from repository secret."
          else
            echo "::error::app/google-services.json is missing."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import sys

          try:
              with open("app/google-services.json", encoding="utf-8") as f:
                  data = json.load(f)

              clients = data.get("client", [])
              if not clients:
                  raise ValueError("No Firebase Android client entries found")

              has_web_client = any(
                  oauth.get("client_type") == 3 and
                  oauth.get("client_id", "").endswith(".apps.googleusercontent.com")
                  for client in clients
                  for oauth in client.get("oauth_client", [])
              )

              if not has_web_client:
                  raise ValueError(
                      "No Web OAuth client (client_type 3) found. "
                      "Google Sign-In may not work without the correct web client ID."
                  )

              print("Firebase JSON valid; Web OAuth client is present.")
          except Exception as exc:
              print(f"::error::Firebase configuration validation failed: {exc}")
              sys.exit(1)
          PY

      - name: Build Debug APK using project Gradle wrapper
        shell: bash
        env:
          GRADLE_OPTS: "-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dorg.gradle.workers.max=2 -Dorg.gradle.configuration-cache=false -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK signature and Firebase fingerprint
        id: verify_apk
        shell: bash
        env:
          EXPECTED_KEYSTORE_SHA1: ${{ steps.signing.outputs.keystore_sha1 }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::Debug APK was not created."
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME:-/opt/android/sdk}/build-tools" \
            -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"

          APK_SHA1_RAW="$(printf '%s\n' "$CERT_OUTPUT" | awk -F': ' '/certificate SHA-1 digest:/{print $2; exit}')"
          APK_SHA256_RAW="$(printf '%s\n' "$CERT_OUTPUT" | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}')"

          format_fp() {
            printf '%s' "$1" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//'
          }
          normalize_fp() {
            printf '%s' "$1" | tr -d ':' | tr '[:lower:]' '[:upper:]'
          }

          APK_SHA1="$(format_fp "$APK_SHA1_RAW")"
          APK_SHA256="$(format_fp "$APK_SHA256_RAW")"

          if [ "$(normalize_fp "$APK_SHA1")" != "$(normalize_fp "$EXPECTED_KEYSTORE_SHA1")" ]; then
            echo "::error::APK was not signed with the exact keystore restored earlier."
            exit 1
          fi

          echo "APK SHA-1: $APK_SHA1"
          echo "APK SHA-256: $APK_SHA256"
          echo "Verified: APK signature matches the persistent Firebase-registered key."
          echo "apk_sha1=$APK_SHA1" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"

          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          ASSET_NAME="${REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="$RUNNER_TEMP/release-assets/$ASSET_NAME"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          test -s "$ASSET_PATH"

          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="my-wallet-debug-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="My Wallet Debug APK #${GITHUB_RUN_NUMBER}"

          NOTES="$(cat <<EOF
          My Wallet Debug APK

          - Repository: ${GITHUB_REPOSITORY}
          - Branch: ${GITHUB_REF_NAME}
          - Commit: ${GITHUB_SHA}
          - Workflow run: ${GITHUB_RUN_NUMBER}
          - APK: ${ASSET_NAME}

          Debug build for testing.
          EOF
          )"

          gh release create "$RELEASE_TAG" "$ASSET_PATH#$ASSET_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES"
            
