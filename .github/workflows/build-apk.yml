name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi

          # Extract Java major version
          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Full Java version string: $RAW_VERSION"
          
          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F '.' '{print $1}')
          if [ "$MAJOR_VERSION" = "1" ]; then
            # Format 1.8...
            MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F '.' '{print $2}')
          fi

          echo "Detected Java major version: $MAJOR_VERSION"

          if [ -z "$MAJOR_VERSION" ] || ! [ "$MAJOR_VERSION" -ge 0 ] 2>/dev/null; then
            echo "Error: Failed to detect valid Java major version."
            exit 1
          fi

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Detected: $MAJOR_VERSION"
            exit 1
          fi

          echo "Java environment verified successfully: Java $MAJOR_VERSION ($JAVA_HOME)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Creating Temporary Debug Keystore ==="
          KEYSTORE_PATH="./debug.keystore"

          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists at $KEYSTORE_PATH. Generation skipped."
          else
            echo "Generating temporary debug keystore at $KEYSTORE_PATH..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Error: Failed to find $KEYSTORE_PATH after keystore generation."
            exit 1
          fi

          echo "Temporary debug keystore verified."

          # Ensure Android SDK licenses are accepted and Platform 36 & 36.1 are installed with sudo permissions
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Granting permissions and accepting Android SDK licenses..."
            sudo mkdir -p "$ANDROID_HOME/licenses"
            sudo chmod -R 777 "$ANDROID_HOME/licenses" 2>/dev/null || true
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a578e44049624e397e46db77429" | sudo tee "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a578e44049624e397e46db77429" | sudo tee "$ANDROID_HOME/licenses/android-sdk-preview-license" > /dev/null
            echo "y" | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

            echo "Installing required Android SDK platforms (36, 36.1) and build-tools (36.0.0)..."
            sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

            if [ -d "$ANDROID_HOME/platforms/android-36" ] && [ ! -d "$ANDROID_HOME/platforms/android-36.1" ]; then
              echo "Synthesizing android-36.1 from android-36..."
              sudo cp -r "$ANDROID_HOME/platforms/android-36" "$ANDROID_HOME/platforms/android-36.1"
              sudo sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=36.1/' "$ANDROID_HOME/platforms/android-36.1/source.properties" 2>/dev/null || true
            fi
            sudo chmod -R 777 "$ANDROID_HOME/platforms" 2>/dev/null || true
          fi

      - name: Build the debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC' -Dorg.gradle.workers.max=2 -Dorg.gradle.configuration-cache=false -Dfile.encoding=UTF-8"
        run: |
          echo "=== Configuring Runner Memory ==="
          # Configure 4GB swap space on the runner to prevent out-of-memory crashes during Kotlin compilation
          sudo fallocate -l 4G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 2>/dev/null || true
          if [ -f /swapfile ]; then
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile >/dev/null 2>&1 || true
            sudo swapon /swapfile >/dev/null 2>&1 || true
          fi
          free -h

          echo "=== Building Debug APK ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          echo "=== Verifying Debug APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ]; then
            case "$EXPECTED_APK" in
              *.apk)
                APK_SIZE=$(stat -c%s "$EXPECTED_APK")
                echo "Verified expected debug APK: $EXPECTED_APK ($APK_SIZE bytes)"
                ;;
              *)
                echo "Error: $EXPECTED_APK does not have .apk extension."
                exit 1
                ;;
            esac
          else
            echo "Error: Expected APK $EXPECTED_APK does not exist or is empty."
            echo "Listing APK files found under app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          ASSET_DIR="$RUNNER_TEMP/release-asset-build"
          mkdir -p "$ASSET_DIR"

          RAW_REPO_NAME="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO_NAME" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="$ASSET_DIR/$ASSET_NAME"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset could not be prepared at $ASSET_PATH"
            exit 1
          fi

          echo "Release asset prepared: $ASSET_PATH ($ASSET_NAME)"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is missing or empty at '$ASSET_PATH'."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Asset file is not an .apk: $ASSET_PATH"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          RELEASE_NOTES=$(cat << 'EOF'
          ### Debug APK Build Details

          - **Build Type**: Automatically generated debug APK
          - **Built by**: GitHub Actions
          - **GitHub Actions Run Number**: ${{ github.run_number }}
          - **GitHub Actions Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit SHA**: ${{ github.sha }}

          ---

          > **Notice**: This APK is intended for testing and development purposes. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating release $RELEASE_TAG for commit $TARGET_COMMIT with asset $ASSET_PATH..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$TARGET_COMMIT" \
            --latest

          echo "Release creation completed successfully."

      - name: Report APK download result
        if: always()
        run: |
          echo "=== Reporting APK Download Result ==="
          RELEASE_OUTCOME="${{ steps.release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          echo "## Android Debug APK Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Workflow Run**: #${{ github.run_number }} (Attempt #${{ github.run_attempt }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "- **Actions Artifact**: \`app-debug-apk\` (available under workflow run summary)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="$REPO_URL/releases/tag/$RELEASE_TAG"
            echo "Release published successfully: $RELEASE_URL"
            echo "- **Release Status**: Published successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag**: \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Download**: Available under the Release Assets section at $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not complete successfully (outcome: $RELEASE_OUTCOME). The debug APK is preserved as Actions artifact 'app-debug-apk'."
            echo "- **Release Status**: :warning: Release creation did not complete ($RELEASE_OUTCOME)." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact Download**: The debug APK is ready and uploaded as the \`app-debug-apk\` artifact. Download it directly from the Summary tab of this workflow run." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Permissions Tip**: If release failed with HTTP 403, enable write access in GitHub: Repository Settings > Actions > General > Workflow permissions > 'Read and write permissions'." >> "$GITHUB_STEP_SUMMARY"
          fi
